<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - JFlix</title>
  <link rel="stylesheet" href="css/tokens.css?v=1.0">
  <link rel="stylesheet" href="css/motion.css?v=1.0">
  <link rel="stylesheet" href="css/common.css?v=49.0">
  <link rel="stylesheet" href="css/loader.css?v=50.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/loader.js?v=51.0"></script>
  <style>
    body {
      background: linear-gradient(135deg, #08080d 0%, #12131f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
    }

    .reset-container {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 20px;
      max-width: 400px;
      width: 90%;
      padding: 40px;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(229, 9, 20, 0.3);
      position: relative;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      box-shadow: 0 8px 24px rgba(255, 180, 0, 0.4);
    }

    .logo-icon i {
      color: #1a0a00;
      font-size: 28px;
    }

    h1 {
      color: #fff;
      margin: 0;
      font-size: 22px;
      font-weight: bold;
    }

    p {
      color: #888;
      margin: 8px 0 0;
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      color: #888;
      font-size: 12px;
      margin-bottom: 6px;
      display: block;
    }

    input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: rgba(255, 215, 0, 0.5);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #e50914, #b20710);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status-message {
      margin-top: 15px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    .status-message.error {
      background: rgba(229, 9, 20, 0.15);
      color: #e50914;
      border: 1px solid rgba(229, 9, 20, 0.2);
    }

    .status-message.success {
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71;
      border: 1px solid rgba(46, 204, 113, 0.2);
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #888;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .back-link a:hover {
      color: #FFD700;
    }

    .loading {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loader" class="loader-wrapper">
    <div class="loader-inner">
      <div class="loader-spinner-box">
        <div class="loader"></div>
        <div class="loader-core"></div>
      </div>
      <div class="loader-text">Loading JFlix</div>
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>
  </div>

  <div class="reset-container">
    <div class="logo-container">
      <div class="logo-icon">
        <i class="fas fa-key"></i>
      </div>
      <h1>Reset Password</h1>
      <p>Enter your new password below</p>
    </div>

    <div class="form-group">
      <label for="new-password">New Password</label>
      <input type="password" id="new-password" placeholder="Enter new password" minlength="6">
    </div>

    <div class="form-group">
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="Confirm new password" minlength="6">
    </div>

    <button onclick="handleResetPassword()" id="reset-btn">
      <span class="btn-text"><i class="fas fa-check"></i> Update Password</span>
      <span class="loading"><i class="fas fa-spinner fa-spin"></i> Updating...</span>
    </button>

    <div id="status-message" class="status-message"></div>

    <div class="back-link">
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

  <script src="js/supabase-config.js?v=48.0"></script>
  <script src="js/supabase-auth.js?v=48.0"></script>
  <script>
    // Hide loading state initially
    document.querySelector('.loading').style.display = 'none';

    async function handleResetPassword() {
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.getElementById('reset-btn');
      const statusEl = document.getElementById('status-message');

      if (!newPassword || !confirmPassword) {
        showStatus('Please fill in all fields', true);
        return;
      }

      if (newPassword !== confirmPassword) {
        showStatus('Passwords do not match', true);
        return;
      }

      if (newPassword.length < 6) {
        showStatus('Password must be at least 6 characters', true);
        return;
      }

      // Show loading state
      btn.disabled = true;
      document.querySelector('.btn-text').style.display = 'none';
      document.querySelector('.loading').style.display = 'inline';
      showStatus('Updating password...', false);

      try {
        // Load Supabase SDK
        await window.SupabaseConfig.loadSupabaseSDK();
        const supabase = window.SupabaseConfig.getSupabaseClient();

        // Get access token from URL hash
        const hash = window.location.hash;
        const accessToken = hash.match(/access_token=([^&]+)/)?.[1];

        if (!accessToken) {
          throw new Error('Invalid or expired reset link');
        }

        // Set the session with the access token
        const { data: { session }, error: sessionError } = await supabase.auth.setSession({
          access_token: accessToken,
        });

        if (sessionError) {
          throw new Error('Invalid or expired reset link');
        }

        // Update password
        const { error: updateError } = await supabase.auth.updateUser({
          password: newPassword
        });

        if (updateError) {
          throw new Error(updateError.message);
        }

        showStatus('Password updated successfully! Redirecting to sign in...', false);

        // Redirect to index.html after 2 seconds
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);

      } catch (error) {
        console.error('Reset password error:', error);
        showStatus(error.message || 'Failed to update password. Please try again.', true);

        // Reset button state
        btn.disabled = false;
        document.querySelector('.btn-text').style.display = 'inline';
        document.querySelector('.loading').style.display = 'none';
      }
    }

    function showStatus(message, isError) {
      const statusEl = document.getElementById('status-message');
      statusEl.style.display = 'block';
      statusEl.className = 'status-message ' + (isError ? 'error' : 'success');
      statusEl.textContent = message;
    }

    // Allow Enter key to submit
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleResetPassword();
      }
    });
  </script>
</body>
</html>
