    <!-- Full Screen Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-overlay-header">
            <div class="search-overlay-input-wrap">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    </main>

    <script src="js/search.js?v=48.0"></script>
    <script src="js/watch.js?v=51.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlayInput = document.getElementById('searchInput');
            const overlayResults = document.getElementById('searchResults');
            const searchHint = document.getElementById('searchHint');
            const searchToggle = document.getElementById('searchToggle');
            const searchClose = document.getElementById('searchClose');
            const searchOverlay = document.getElementById('searchOverlay');

            // Open search overlay
            if (searchToggle && searchOverlay) {
                searchToggle.addEventListener('click', () => {
                    searchOverlay.classList.add('active');
                    if (overlayInput) {
                        setTimeout(() => overlayInput.focus(), 100);
                    }
                });
            }

            // Close search overlay
            if (searchClose && searchOverlay) {
                searchClose.addEventListener('click', () => {
                    searchOverlay.classList.remove('active');
                    if (overlayInput) {
                        overlayInput.value = '';
                        overlayInput.dispatchEvent(new Event('input')); // Reset search results
                    }
                });
            }

            if (overlayInput && overlayResults) {
                initLiveSearch(overlayInput, overlayResults);
                overlayInput.addEventListener('input', () => {
                    if (searchHint) searchHint.style.display = overlayInput.value.trim().length > 0 ? 'none' : 'block';
                });
            }

            // Mobile navigation toggle
            const navToggle = document.getElementById('navToggle');
            const navLinks = document.getElementById('navLinks');
            
            if (navToggle && navLinks) {
                navToggle.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    navToggle.classList.toggle('active');
                    navLinks.classList.toggle('active');
                });

                // Close menu when clicking a link
                navLinks.querySelectorAll('.nav-link').forEach(link => {
                    link.addEventListener('click', () => {
                        navToggle.classList.remove('active');
                        navLinks.classList.remove('active');
                    });
                });

                // Close menu when clicking outside
                document.addEventListener('click', (e) => {
                    if (!navToggle.contains(e.target) && !navLinks.contains(e.target)) {
                        navToggle.classList.remove('active');
                        navLinks.classList.remove('active');
                    }
                });
            }
        });
    </script>
    <!-- Floating Button to JFlix -->

        <span class="tooltip">Go to JFlix</span>
