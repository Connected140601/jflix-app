<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e50914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b20710;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Play button icon -->
  <circle cx="30" cy="30" r="25" fill="url(#logoGradient)" filter="url(#glow)"/>
  <polygon points="25,20 25,40 42,30" fill="white"/>
  
  <!-- ANIU Text -->
  <text x="65" y="38" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2">ANIU</text>
  
  <!-- Decorative line -->
  <line x1="65" y1="45" x2="145" y2="45" stroke="#e50914" stroke-width="2" stroke-linecap="round"/>
</svg>
